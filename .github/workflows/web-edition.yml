name: Web edition checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend syntax
        run: |
          node --check web/app.js
          for file in web/*.mjs; do node --check "$file"; done
      - name: Run CV matcher tests
        run: node --test web/matcher.test.mjs
